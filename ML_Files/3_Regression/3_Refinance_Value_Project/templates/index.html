<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Refinance Volume Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Refinance Volume Prediction</h2>
    <form method="post" action="/">
        {% for col in feature_columns %}
        <div class="mb-3">
            <label for="{{ col }}" class="form-label">{{ col }}</label>
            <input type="number" step="any" class="form-control" name="{{ col }}" id="{{ col }}" required>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Predict</button>
    </form>
    {% if prediction is not none %}
    <div class="alert alert-success mt-4">
        <strong>Predicted Refinance Volume:</strong> {{ prediction }}
    </div>
    {% endif %}
</div>
</body>
</html>
